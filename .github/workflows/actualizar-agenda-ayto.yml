name: Actualizar agenda local (Ayuntamiento)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizar agenda desde API del Ayuntamiento
        run: |
          python3 scripts/actualizar_agenda_ayto.py
          node scripts/render-home-widgets-static.js

      - name: Commit cambios si hay actualización
        id: commit
        run: |
          if git diff --quiet data/agenda-local.json; then
            echo "Sin cambios en agenda-local.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agenda-local.json index.html
          git commit -m "Actualiza agenda local (eventos Ayuntamiento)"
          git push origin develop
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar publicación en main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicar-produccion.yml --ref develop
