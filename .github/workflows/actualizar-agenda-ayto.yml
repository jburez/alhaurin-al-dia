name: Actualizar agenda local (Ayuntamiento)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizar agenda desde API del Ayuntamiento
        run: python3 scripts/actualizar_agenda_ayto.py

      - name: Actualizar agenda desde alhaurinhoy.es
        run: python3 scripts/actualizar_agenda_alhaurinhoy.py

      - name: Generar páginas de eventos
        run: python3 scripts/generar_paginas_eventos.py

      - name: Renderizar widgets estáticos
        run: node scripts/render-home-widgets-static.js

      - name: Commit cambios si hay actualización
        id: commit
        run: |
          if git diff --quiet data/agenda-local.json; then
            echo "Sin cambios en agenda-local.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agenda-local.json data/evento-slugs.json index.html planes/
          git commit -m "Actualiza agenda local y páginas de eventos"
          git push origin develop
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar publicación en producción
        # Un push con el GITHUB_TOKEN por defecto no dispara otros workflows
        # con `on: push` (ver .github/workflows/sync-admin-panel.yml para el
        # detalle) — sin este paso, este commit nunca llegaría solo a main.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-produccion.yml --ref develop

