name: Actualizar avisos AEMET

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-avisos-aemet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar avisos desde AEMET (Sol y Guadalhorce)
        run: python3 scripts/actualizar_avisos_aemet.py

      - name: Commit cambios si hay actualización
        id: commit
        run: |
          if git diff --quiet data/avisos-oficiales.json; then
            echo "Sin cambios en data/avisos-oficiales.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/avisos-oficiales.json
          git commit -m "Actualiza avisos AEMET (Sol y Guadalhorce)"
          git push origin develop
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar publicación en producción
        # Un push con el GITHUB_TOKEN por defecto no dispara otros workflows
        # con `on: push` (ver .github/workflows/sync-admin-panel.yml para el
        # detalle) — sin este paso, este commit nunca llegaría solo a main.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-produccion.yml --ref develop

