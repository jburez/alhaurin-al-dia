name: Generar noticias automáticas

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar noticias y sitemap
        run: |
          python scripts/generar_noticias.py

      - name: Commit automático si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/noticias.json sitemap.xml noticias categoria

          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "🤖 Actualización automática de noticias"
            git push origin develop
          fi
