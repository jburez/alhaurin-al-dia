name: Publicar en producción

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: publicar-produccion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis de scripts
        run: python -m py_compile scripts/generar_noticias.py scripts/generar_noticias_seguro.py scripts/validar_contenido.py

      - name: Validar noticias, páginas y sitemap
        run: python scripts/validar_contenido.py

      - name: Fusionar develop en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main
          git merge origin/develop --no-edit -m "🤖 Publicar en producción: sincroniza main con develop"
          git push origin main
