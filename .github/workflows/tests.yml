name: Tests y validación

# Red de seguridad: ejecuta los tests del pipeline editorial y los validadores
# antes de que un cambio llegue a producción. Corre en cada push a develop
# (los pushes de los bots con GITHUB_TOKEN no lo disparan, solo los manuales),
# en cada pull request y a mano.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests Python
        # Los tests son scripts que imprimen OK/FALLA y salen con código 1 si algo falla.
        run: |
          fallos=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if ! python "$t"; then echo "::error file=$t::Test fallido"; fallos=$((fallos+1)); fi
            echo "::endgroup::"
          done
          echo "Tests Python fallidos: $fallos"
          test "$fallos" -eq 0

      - name: Tests Node
        run: |
          fallos=0
          for t in tests/test_*.js; do
            echo "::group::$t"
            if ! node "$t"; then echo "::error file=$t::Test fallido"; fallos=$((fallos+1)); fi
            echo "::endgroup::"
          done
          test "$fallos" -eq 0

      - name: Validar contenido
        run: python scripts/validar_contenido.py

      - name: Auditoría SEO y páginas huérfanas
        run: |
          node scripts/audit-seo.js
          node scripts/audit-orphan-pages.js

      - name: Comprobar que los sitemaps se generan
        run: node scripts/generate-sitemaps.js
