name: Actualizar tiempo AEMET

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,10,15 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-weather-aemet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar tiempo desde AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python3 scripts/actualizar_tiempo_aemet.py

      - name: Commit cambios si hay actualización
        id: commit
        run: |
          if git diff --quiet data/tiempo-aemet.json; then
            echo "Sin cambios en data/tiempo-aemet.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tiempo-aemet.json
          git commit -m "Actualiza tiempo desde AEMET"
          git push origin develop
          echo "changed=true" >> "$GITHUB_OUTPUT"
