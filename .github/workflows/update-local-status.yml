name: Actualizar tiempo AEMET

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6,10,15 * * *"

permissions:
  contents: write
  actions: write

jobs:
  update-weather-aemet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizar tiempo desde AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python3 scripts/actualizar_tiempo_aemet.py

      - name: Regenerar página estática de Tiempo
        # data/tiempo-aemet.json solo es la fuente de datos: sin este paso,
        # /tiempo/ se queda congelada con lo que hubiera en el último build
        # manual, aunque el JSON se actualice cada pocas horas (causa real
        # de la regresión de frescura del 2026-08-20).
        run: node scripts/render-tiempo-static.js

      - name: Commit cambios si hay actualización
        id: commit
        run: |
          if git diff --quiet data/tiempo-aemet.json tiempo/index.html; then
            echo "Sin cambios en data/tiempo-aemet.json ni tiempo/index.html"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tiempo-aemet.json tiempo/index.html
          git commit -m "Actualiza tiempo desde AEMET"
          git push origin develop
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Disparar publicación en producción
        # Un push con el GITHUB_TOKEN por defecto no dispara otros workflows
        # con `on: push` (ver .github/workflows/sync-admin-panel.yml para el
        # detalle) — sin este paso, este commit nunca llegaría solo a main.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar-produccion.yml --ref develop
