name: Validar contenido

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  validar-contenido:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar sintaxis de scripts
        run: python -m py_compile scripts/generar_noticias.py scripts/generar_noticias_seguro.py scripts/validar_contenido.py

      - name: Validar noticias, páginas y sitemap
        run: python scripts/validar_contenido.py
