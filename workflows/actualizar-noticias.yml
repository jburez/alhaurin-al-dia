name: Actualizar noticias

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests urllib3 python-dotenv openai

      - name: Generar noticias
        run: python scripts/generar_noticias.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Comprobar cambios
        id: cambios
        run: |
          if git diff --quiet data/noticias.json; then
            echo "hay_cambios=false" >> $GITHUB_OUTPUT
          else
            echo "hay_cambios=true" >> $GITHUB_OUTPUT
          fi

      - name: Guardar noticias actualizadas
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/noticias.json
          git commit -m "Actualizar noticias automáticamente"
          git push
